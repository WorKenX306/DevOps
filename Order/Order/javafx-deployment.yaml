apiVersion: v1
kind: ConfigMap
metadata:
  name: javafx-config
  namespace: devops
data:
  JAVAFX_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/orderdb
---
apiVersion: v1
kind: Secret
metadata:
  name: javafx-secret
  namespace: devops
type: Opaque
data:
  JAVAFX_DATASOURCE_USERNAME: cm9vdA==        # "root" en base64
  JAVAFX_DATASOURCE_PASSWORD: cGFzc3dvcmQ=    # "password" en base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-app
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-app
  template:
    metadata:
      labels:
        app: order-app
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      containers:
      - name: order-app
        image: hassen434/order-app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: javafx-config
        - secretRef:
            name: javafx-secret
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "orderdb"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-app-service
  namespace: devops
spec:
  type: NodePort
  selector:
    app: order-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30007
