apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/springdb
---
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n        # "spring" en base64
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz    # "spring123" en base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-app
  template:
    metadata:
      labels:
        app: order-app
    spec:
      containers:
      - name: order-app
        image: hassen434/order-app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: spring-config
        - secretRef:
            name: spring-secret
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: devops
spec:
  selector:
    app: order-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort

