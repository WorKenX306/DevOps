apiVersion: v1
kind: ConfigMap
metadata:
  name: javafx-config
data:
  DB_URL: "jdbc:mysql://mysql-service:3306/javafxdb"
  DB_USERNAME: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: javafx-secret
type: Opaque
data:
  DB_PASSWORD: cm9vdDEyMw==  # root123 en base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: javafx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: javafx-app
  template:
    metadata:
      labels:
        app: javafx-app
    spec:
      containers:
      - name: javafx-app
        image: hassen434/javafx-app:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: javafx-config
              key: DB_URL
        - name: DATABASE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: javafx-config
              key: DB_USERNAME
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: javafx-secret
              key: DB_PASSWORD
        ports:
        - containerPort: 8080
